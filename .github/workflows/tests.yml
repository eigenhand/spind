name: Tests

# Warum es das gibt: 45 Tests, die bisher nur lief, wer daran dachte. Bei einer App,
# die Dateien synchronisiert und löscht, ist das die falsche Stelle zum Sparen.
#
# `swift test` und nicht xcodebuild: die prüfbare Hälfte von Spind liegt in SpindCore,
# und das ist ein gewöhnliches SPM-Ziel. Kein Simulator, kein Projekt erzeugen, keine
# Signierung — zwölf Sekunden Testlauf statt zweier Minuten Vorbereitung. Die
# Oberfläche und die File-Provider-Erweiterung bleiben aussen vor; sie brauchen ein
# angemeldetes Gerät und eine echte Storage Box.
#
# macOS-Minuten zählen bei privaten Repos zehnfach. Deshalb keine Läufe für
# Änderungen, die den Code nicht anfassen.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: SpindCore
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Werkzeugkette melden
        run: swift --version

      # Die Abhängigkeiten kommen aus dem Netz; Package.resolved legt die Fassungen
      # fest, und der Zwischenspeicher hängt genau daran. Ändert sich eine Fassung,
      # wird neu geholt — sonst nicht.
      - name: Abhängigkeiten zwischenspeichern
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Tests
        run: swift test --filter SpindCoreTests
