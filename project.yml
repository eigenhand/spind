name: Spind
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: dev.eigenhand
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
packages:
  SpindPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    DEVELOPMENT_TEAM: $(SPIND_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    # The one place the version lives. A release means bumping these two:
    # Sparkle compares CFBundleVersion and offers nothing when it has not
    # grown, so shipping twice under the same number reaches nobody.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Spind:
    type: application
    platform: macOS
    sources:
      - Sources/SpindApp
      - Resources/Assets.xcassets
      - Resources/Localizable.xcstrings
      - Resources/AppShortcuts.xcstrings
    dependencies:
      - package: SpindPackage
        product: SpindCore
      - package: Sparkle
        product: Sparkle
      - target: SpindFileProvider
        embed: true
    info:
      path: xcode/Spind-Info.plist
      properties:
        CFBundleDisplayName: Spind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpindAppGroup: $(SPIND_APP_GROUP)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # Automatische Updates (Sparkle): Appcast liegt beim jeweils
        # neuesten GitHub-Release, signiert mit dem EdDSA-Schlüssel.
        SUFeedURL: https://github.com/eigenhand/spind/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPIND_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: xcode/Spind.entitlements
      properties:
        keychain-access-groups:
          - $(SPIND_APP_GROUP)
        com.apple.security.application-groups:
          - $(SPIND_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_BUNDLE_ID)
        PRODUCT_NAME: Spind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SpindMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SpindMobile
      - Resources/AssetsMobile.xcassets
      # Derselbe Katalog wie am Mac, und mit Absicht: Beide Apps sprechen ueber
      # dieselben Dinge, und ein zweiter Katalog haette dieselben Saetze noch
      # einmal — einmal uebersetzt und einmal vergessen.
      - Resources/Localizable.xcstrings
    dependencies:
      - package: SpindPackage
        product: SpindCore
      - target: SpindMobileFileProvider
        embed: true
    info:
      path: xcode/SpindMobile-Info.plist
      properties:
        CFBundleDisplayName: Spind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpindAppGroup: $(SPIND_IOS_APP_GROUP)
        UILaunchScreen: {}
        NSCameraUsageDescription: Zum Scannen des Kopplungscodes aus der Mac-App.
        NSPhotoLibraryUsageDescription: Um deine Aufnahmen in deinen eigenen Spind
          zu sichern. Spind liest nur und löscht nichts vom iPhone.
        NSFaceIDUsageDescription: Um die App beim Öffnen zu entsperren.
        ITSAppUsesNonExemptEncryption: false
        # SFTP kann nicht von sich aus Bescheid geben, dass anderswo etwas
        # gelöscht wurde. iOS weckt die App gelegentlich auf, damit sie die
        # Dateien-App zum Nachsehen anstößt.
        UIBackgroundModes:
          - fetch
        SpindRefreshTaskID: $(SPIND_IOS_BUNDLE_ID).refresh
        BGTaskSchedulerPermittedIdentifiers:
          - $(SPIND_IOS_BUNDLE_ID).refresh
    entitlements:
      path: xcode/SpindMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SPIND_IOS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_IOS_BUNDLE_ID)
        PRODUCT_NAME: Spind
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
  SpindMobileFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SpindFileProvider
    dependencies:
      - package: SpindPackage
        product: SpindCore
    info:
      path: xcode/SpindMobileFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Spind File Provider
        SpindAppGroup: $(SPIND_IOS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(SPIND_IOS_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: xcode/SpindMobileFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SPIND_IOS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_IOS_BUNDLE_ID).fileprovider
        # Xcode 27 lagert Debug-Code in eine Neben-Dylib aus; ExtensionKit
        # findet die Principal-Klasse dann nicht mehr (leerer 37-KB-Stub,
        # Extension startet nie). Für Extensions deshalb abschalten.
        ENABLE_DEBUG_DYLIB: NO
  SpindMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/SpindMobileUITests
    dependencies:
      - target: SpindMobile
    settings:
      base:
        TEST_TARGET_NAME: SpindMobile
        GENERATE_INFOPLIST_FILE: YES
  SpindFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - Sources/SpindFileProvider
    dependencies:
      - package: SpindPackage
        product: SpindCore
    info:
      path: xcode/SpindFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Spind File Provider
        SpindAppGroup: $(SPIND_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(SPIND_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.keep
              NSExtensionFileProviderActionName: Auf dem Computer behalten
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.free
              NSExtensionFileProviderActionName: Platz freigeben
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.share
              NSExtensionFileProviderActionName: Ordner teilen (Zugang kopieren)
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            # Bewusst TRUEPREDICATE: ein fehlerhaft ausgewertetes Prädikat
            # lässt die Aktion im Finder komplett verschwinden. Nicht
            # unterstützte Dateitypen meldet die App verständlich zurück.
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.edit
              NSExtensionFileProviderActionName: Im Browser gemeinsam bearbeiten
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.versions
              NSExtensionFileProviderActionName: Versionsverlauf anzeigen
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
        NSFileProviderDecorations:
          - Identifier: dev.eigenhand.spind.shared
            BadgeImageType: com.apple.icon-decoration.badge.person
            Label: Geteilter Ordner
    entitlements:
      path: xcode/SpindFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(SPIND_APP_GROUP)
        com.apple.security.application-groups:
          - $(SPIND_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_BUNDLE_ID).fileprovider
