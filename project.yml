name: Spind
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: dev.eigenhand
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
packages:
  SpindPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    DEVELOPMENT_TEAM: $(SPIND_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    # The one place the version lives. A release means bumping these two:
    # Sparkle compares CFBundleVersion and offers nothing when it has not
    # grown, so shipping twice under the same number reaches nobody.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Spind:
    type: application
    platform: macOS
    sources:
      - Sources/SpindApp
      - Resources/Assets.xcassets
      - Resources/Localizable.xcstrings
      - Resources/AppShortcuts.xcstrings
    dependencies:
      - package: SpindPackage
        product: SpindCore
      - package: Sparkle
        product: Sparkle
      - target: SpindFileProvider
        embed: true
    info:
      path: xcode/Spind-Info.plist
      properties:
        CFBundleDisplayName: Spind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpindAppGroup: $(SPIND_APP_GROUP)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # Automatische Updates (Sparkle): Appcast liegt beim jeweils
        # latest GitHub release, signed with the EdDSA key.
        SUFeedURL: https://github.com/eigenhand/spind/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPIND_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: xcode/Spind.entitlements
      properties:
        keychain-access-groups:
          - $(SPIND_APP_GROUP)
        com.apple.security.application-groups:
          - $(SPIND_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_BUNDLE_ID)
        PRODUCT_NAME: Spind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SpindMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SpindMobile
      - Resources/AssetsMobile.xcassets
      # The same catalogue as on the Mac, and deliberately so: both apps talk
      # about the same things, and a second catalogue would hold the same
      # sentences twice — translated once and forgotten once.
      - Resources/Localizable.xcstrings
      # Required-reason APIs of this target (App Store privacy manifest).
      - path: xcode/SpindMobile/PrivacyInfo.xcprivacy
        buildPhase: resources
      # English for the permission prompts; German stays in the Info.plist.
      - xcode/SpindMobile/InfoPlist.xcstrings
    dependencies:
      - package: SpindPackage
        product: SpindCore
      - target: SpindMobileFileProvider
        embed: true
    info:
      path: xcode/SpindMobile-Info.plist
      properties:
        CFBundleDisplayName: Spind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpindAppGroup: $(SPIND_IOS_APP_GROUP)
        UILaunchScreen: {}
        NSCameraUsageDescription: Zum Scannen des Kopplungscodes aus der Mac-App.
        NSPhotoLibraryUsageDescription: Um deine Aufnahmen in deinen eigenen Spind
          zu sichern. Spind liest nur und löscht nichts vom iPhone.
        NSFaceIDUsageDescription: Um die App beim Öffnen zu entsperren.
        # SSH runs on BoringSSL (standard algorithms, not the OS's crypto): declared,
        # App Store Connect then asks the export questions (French declaration or no France).
        ITSAppUsesNonExemptEncryption: true
        # SFTP cannot report of its own accord that something was deleted
        # elsewhere. iOS wakes the app occasionally so that it can nudge the
        # Files app into taking a look.
        UIBackgroundModes:
          - fetch
        SpindRefreshTaskID: $(SPIND_IOS_BUNDLE_ID).refresh
        BGTaskSchedulerPermittedIdentifiers:
          - $(SPIND_IOS_BUNDLE_ID).refresh
    entitlements:
      path: xcode/SpindMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SPIND_IOS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_IOS_BUNDLE_ID)
        PRODUCT_NAME: Spind
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
      # Release archives sign with fixed App Store profiles: automatic signing
      # through the API key cannot create the development profile it wants first.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Spind App Store - (API)"
  SpindMobileFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/SpindFileProvider
      - path: xcode/SpindMobileFileProvider/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SpindPackage
        product: SpindCore
    info:
      path: xcode/SpindMobileFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Spind File Provider
        SpindAppGroup: $(SPIND_IOS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(SPIND_IOS_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: xcode/SpindMobileFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SPIND_IOS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_IOS_BUNDLE_ID).fileprovider
        # Xcode 27 moves debug code out into a side dylib; ExtensionKit then
        # no longer finds the principal class (an empty 37 KB stub, the
        # extension never starts). Switched off for extensions for that reason.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Spind File Provider App Store - (API)"
  SpindMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/SpindMobileUITests
    dependencies:
      - target: SpindMobile
    settings:
      base:
        TEST_TARGET_NAME: SpindMobile
        GENERATE_INFOPLIST_FILE: YES
  SpindFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - Sources/SpindFileProvider
    dependencies:
      - package: SpindPackage
        product: SpindCore
    info:
      path: xcode/SpindFileProvider-Info.plist
      properties:
        CFBundleDisplayName: Spind File Provider
        SpindAppGroup: $(SPIND_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(SPIND_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.keep
              NSExtensionFileProviderActionName: Auf dem Computer behalten
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.free
              NSExtensionFileProviderActionName: Platz freigeben
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.share
              NSExtensionFileProviderActionName: Ordner teilen (Zugang kopieren)
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            # Deliberately TRUEPREDICATE: a predicate that evaluates wrongly
            # makes the action disappear from the Finder entirely. The app
            # reports unsupported file types back in plain words.
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.edit
              NSExtensionFileProviderActionName: Im Browser gemeinsam bearbeiten
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: dev.eigenhand.spind.versions
              NSExtensionFileProviderActionName: Versionsverlauf anzeigen
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
        NSFileProviderDecorations:
          - Identifier: dev.eigenhand.spind.shared
            BadgeImageType: com.apple.icon-decoration.badge.person
            Label: Geteilter Ordner
    entitlements:
      path: xcode/SpindFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(SPIND_APP_GROUP)
        com.apple.security.application-groups:
          - $(SPIND_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIND_BUNDLE_ID).fileprovider
