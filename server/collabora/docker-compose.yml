# Collabora Online + the Spind WOPI bridge
#
#   docker compose -p spind-collabora up -d --build
#
# Collabora only renders — the documents come from the WOPI bridge, which
# reaches the Hetzner Storage Box over WebDAV. Both services listen on
# 127.0.0.1 only; the Caddy gateway is the sole way out
# (doc.example.de).

name: spind-collabora

services:
  collabora:
    image: collabora/code:24.04.13.2.1
    container_name: spind-collabora
    restart: unless-stopped
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      # Permitted WOPI hosts (the bridge). A regex; escape the dots.
      aliasgroup1: "https://doc\\.example\\.de:443"
      DONT_GEN_SSL_CERT: "true"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.proto=IPv4
        --o:logging.level=warning
        --o:home_mode.enable=true
        --o:security.seccomp=true
        --o:admin_console.enable=false
    # Collabora locks every document into a jail of its own — for which it
    # needs mount namespaces (SYS_ADMIN) and its setuid helper coolmount.
    # no-new-privileges would block precisely that ("Operation not
    # permitted" when forking the child processes).
    cap_add:
      - MKNOD
      - SYS_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9980/hosting/discovery >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  wopi:
    build: ./wopi
    image: spind/wopi:latest
    container_name: spind-wopi
    restart: unless-stopped
    ports:
      - "127.0.0.1:9981:9981"
    env_file:
      - wopi.env
    environment:
      # The container-internal route to Collabora (discovery); the browser
      # only ever sees PUBLIC_URL.
      COLLABORA_URL: http://collabora:9980
      PUBLIC_URL: https://doc.example.de
    depends_on:
      - collabora
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
